name: AZ Pisos

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "privado = te manda al bot el último piso de cada canal · prueba = solo log · real = publica en el canal"
        type: choice
        options: [privado, prueba, real]
        default: privado

concurrency:
  group: azpisos
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m bot.main
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          DEST_CHANNEL: ${{ secrets.DEST_CHANNEL }}
          SOURCE_CHANNELS: ${{ secrets.SOURCE_CHANNELS }}
          AGENCY_NAMES: ${{ secrets.AGENCY_NAMES }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BACKFILL_MSGS: ${{ vars.BACKFILL_MSGS }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.modo || 'real' }}
      - name: Guardar estado
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "azp-bot"
            git config user.email "azp-bot@users.noreply.github.com"
            git add state.json
            git commit -m "estado"
            git push
          fi
