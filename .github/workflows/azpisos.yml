name: AZ Pisos

on:
  schedule:
    - cron: "*/10 * * * *"   # respaldo: GitHub lo lanza cuando puede
  workflow_dispatch:
    inputs:
      modo:
        description: "privado = te manda al bot el último piso de cada canal · prueba = solo log · real = publica en el canal"
        type: choice
        options: [privado, prueba, real]
        default: privado

concurrency:
  group: azpisos
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      DEST_CHANNEL: ${{ secrets.DEST_CHANNEL }}
      SOURCE_CHANNELS: ${{ secrets.SOURCE_CHANNELS }}
      AGENCY_NAMES: ${{ secrets.AGENCY_NAMES }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PREVIEW_CHAT: ${{ secrets.PREVIEW_CHAT }}
      BACKFILL_MSGS: ${{ vars.BACKFILL_MSGS }}
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.modo || 'real' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Vigilar canales
        run: |
          git config user.name "azp-bot"
          git config user.email "azp-bot@users.noreply.github.com"
          guardar() {
            if [ -n "$(git status --porcelain state.json)" ]; then
              git add state.json && git commit -qm "estado"
              git pull -q --rebase -X theirs origin main || git rebase --abort
              git push -q || echo "no se pudo guardar el estado"
            else
              git pull -q --rebase origin main || true   # coge mejoras del código sin reiniciar
            fi
          }
          if [ "$MODE" != "real" ]; then
            rc=0; python -m bot.main || rc=$?; guardar; exit $rc
          fi
          # modo real: revisar cada 10 min durante ~5 h 40 min
          fin=$((SECONDS + 20400))
          while [ $SECONDS -lt $fin ]; do
            inicio=$SECONDS
            python -m bot.main || echo "pasada con error, sigo"
            guardar
            espera=$((600 - (SECONDS - inicio)))
            if [ $((SECONDS + espera)) -ge $fin ]; then break; fi
            if [ $espera -gt 0 ]; then sleep $espera; fi
          done
      - name: Lanzar el siguiente turno
        if: always() && env.MODE == 'real'
        run: gh workflow run azpisos.yml --repo "$GITHUB_REPOSITORY" -f modo=real
